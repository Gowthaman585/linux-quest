<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="hero-header">
        <h1>Question {{ q.id }}</h1>
	<p class="quiz-question" >{{ q.question }}</p>
    </header>

    <main class="action-area" style="width: 100%; max-width: 500px; text-align: left;">
	    <form action="{{ url_for('main.quiz_question',q_id=q.id) }}" method="POST" style="display: flex-direction: column; gap: 1 rem;">
            {% for choice in q.choices %}
	    <label class="quiz-choice">
		    <input type="radio" name="answer" value="{{ loop.index }}">
		    {{ choice }}
            </label>
            {% endfor %}

            <button type="submit" class="btn-start" style="margin-top: 1rem; width: 100%;">Submit Answer</button>
        </form>
    </main>
</body>
</html>
